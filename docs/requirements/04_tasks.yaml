schema_version: 1
baseline_ref: 00_manifest.yaml
source_section: '15'
purpose: Пять инкрементов существующего плана, без отдельных Contract/Proposal/approval-процедур для каждого.
dependency_semantics:
- depends_on — зависимость полноценного интегрированного результата. Она не запрещает начать явно перечисленную
  независимую часть раньше.
- TASK-02 и независимая часть TASK-03 могут идти параллельно после появления каркаса; чистая математика может начаться
  одновременно с API-исследованием.
- Недоступный API блокирует конкретный интеграционный результат, а не весь проект.
- Правило или AC может участвовать в нескольких задачах; оно остаётся одной канонической записью, а частичная проверка
  не закрывает весь AC.
always_read_rule_refs:
- SCP-01
- SCP-02
- SCP-03
- SCP-04
- SCP-05
scope_reduction_order_verbatim: Если фактический API окажется сложнее ожиданий, сокращать сначала декоративный UI,
  поиск кампаний, вторую конфигурацию запуска и отдельные документы. **Не сокращать** архив, Pin, Fetch semantics,
  безопасный Push и тесты математики.
