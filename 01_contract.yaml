  statement: Remove исключает привязку из активного черновика. Строка остаётся приглушённой как Removed с 0% и Bring
    Back; активные доли пересчитываются до Push. Push убирает только привязку из целевого потока, не глобальный
    Offer. После успешного Push строка остаётся в архиве Adrobot и доступна для восстановления.
  source_sections:
