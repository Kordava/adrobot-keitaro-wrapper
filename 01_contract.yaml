- id: ED-07
  class: ENG
  statement: Синхронизация архива допустима только после успешного полного чтения нужных потоков и всех страниц
    выдачи с валидацией схем. Таймаут, частичный ответ, ошибка авторизации, 5xx или невалидный JSON не переводят
    известные строки в Removed и не перезаписывают архив ошибочными данными; прежнее состояние UI сохраняется с
    ошибкой. Fetch при изменённом черновике требует явного подтверждения его сброса.
