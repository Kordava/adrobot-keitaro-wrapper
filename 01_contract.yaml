- id: ED-05
  class: DESIGN
  statement: Повторное добавление одного offer_id в тот же поток запрещено в принятой модели; другая модель bindings
    возможна только после подтверждения API. Bring Back для глобально отсутствующего Offer ID возвращает ошибку
    валидации. Поток с внешне удалёнными всеми офферами сохраняет отображение известного локального архива и Bring
    Back; пустой текущий список сам по себе не означает неофферный поток. При отсутствии истории тип определяется
    по минимальным полям API без разбора URL и фильтров редиректа.
