- id: ED-12
  class: DESIGN
  statement: Pin/Unpin в SNAPSHOT меняет только локальное намерение, не пересчитывая считанные доли; отличающиеся
    от базы Pin создают DIRTY. Pin/Unpin в RECALCULATED сразу вызывает новый Preview по текущему составу и текущим
    Pin. Невалидное действие оставляет предыдущий валидный результат.
  source_sections:
