schema_version: 1
baseline_ref: 00_manifest.yaml
role: Derived operational extraction of the accepted specification; not a new specification.
language: ru
reading_rules:
- Все выбранные REQ, DEMO-REQ, DESIGN и ENG обязательны в принятом объёме. DESIGN здесь не означает непринятое предложение.
- Класс обозначает основное основание записи; точные формулировки и происхождение деталей проверяются по source_sections/source_ids.
- api_gates ссылается на используемое исследование. Срок применения зависимости задан в 03_api_discovery.yaml; математический
  расчёт, внутренние DTO и fake-тесты из-за отсутствия live API не блокируются.
- verification описывает проверку уже принятого правила и не добавляет новый критерий приёмки.
- Если сжатая запись расходится с исходным ТЗ, исправить производную запись по ТЗ. Не выбирать трактовку молча и
  не добавлять функциональность.
definitions:
- term: '`Campaign`'
  meaning: Кампания Keitaro, у которой есть ID, домен, группа, источник и потоки
  source_section: '2'
- term: '`Stream` / `Flow`'
  meaning: Поток Keitaro; может содержать офферы либо выполнять другое действие, например redirect
  source_section: '2'
- term: '`Offer`'
  meaning: Глобальная уже существующая сущность Keitaro с ID
  source_section: '2'
- term: '`Offer binding`'
  meaning: '**Привязка** оффера к конкретному потоку; именно её создаёт/убирает редактор'
  source_section: '2'
- term: '`Active`'
  meaning: Привязка присутствует в текущей конфигурации Keitaro либо включена в редактируемый черновик
  source_section: '2'
- term: '`Removed`'
  meaning: Привязка была известна Adrobot, но сейчас отсутствует в Keitaro или помечена к удалению в черновике
  source_section: '2'
- term: '`Displayed share`'
  meaning: Целочисленная доля, показанная пользователю; её связь с полями Keitaro устанавливается API mapping
  source_section: '2'
- term: '`Pinned share`'
  meaning: Локальная настройка Adrobot, фиксирующая долю конкретной активной привязки при следующем перераспределении
  source_section: '2'
- term: '`Snapshot`'
  meaning: Последнее успешно прочитанное и валидированное состояние Keitaro для данного потока **и базовые локальные
    Pin** на момент Fetch/подтверждённого Push
  source_section: '2'
- term: '`Draft`'
  meaning: Неопубликованные изменения относительно snapshot, в том числе добавление/удаление/восстановление/Pin
  source_section: '2'
- term: '`Draft mode`'
  meaning: '`SNAPSHOT` — показывать считанные доли; `RECALCULATED` — пересчитать по текущему составу и Pin'
  source_section: '2'
- term: '`base_pin_revision`'
  meaning: Отпечаток базового набора ранее известных привязок и их Pin, используемый для best-effort сверки локальных
    настроек при Push
  source_section: '2'
rules:
- id: SCP-01
  class: DESIGN
  statement: 'Соблюдать принятую иерархию: письменные требования S1, существенная бизнес-логика S2, подтверждённая
    семантика API, затем DESIGN/ENG. DEMO-REQ обязателен; ENG является нашим обязательным стандартом, а DESIGN принят,
    если не помечен OPEN. Справочная документация Keitaro не расширяет объём заказчика. OPEN блокирует только затрагиваемую
    часть реализации; инженерное решение не меняет показанную продуктовую логику.'
  source_sections:
  - '0.1'
  - '0.2'
  source_ids: []
  verification: У каждого решения различены подтверждённое поведение, принятое внутреннее правило и неподтверждённый
    API-контракт.
  api_gates: []
  acceptance_refs: []
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: SCP-02
  class: REQ
  statement: 'Реализовать небольшое веб-приложение на FastAPI с SQLAlchemy: создатель кампаний и редактор существующих
    потоков с историей привязок и Pin. Итоговые сценарии реально работают с тестовым Keitaro; моки допустимы в автоматических
    тестах. Frontend произвольный, но все представленные действия, значения и статусы настоящие.'
  source_sections:
  - '1'
  - '7.1'
  - '11.1'
  source_ids:
  - REQ-01
  - REQ-02
  - REQ-03
  verification: Оба пользовательских сценария выполняются через рабочий UI и подтверждаются в выделенном тестовом
    Keitaro.
  api_gates: []
  acceptance_refs:
  - AC-C-01
  - AC-E-01
  - AC-Q-09
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: SCP-03
  class: DESIGN
  statement: В базовый объём не входят создание/удаление глобальных Offer, лендинги и партнёрские сети, Meta/Facebook
    и рекламные кабинеты, аналитика рекламных кампаний, CRM, сложный поиск кампаний, пользователи/роли, отдельная
    страница архива, произвольный редактор процентов, Stats/Trends без реальных данных, микросервисы, брокеры, Redis/Celery,
    Kubernetes, production-scale инфраструктура, автоматический откат удалённых сущностей и распределённая транзакция
    с Keitaro.
  source_sections:
  - '1.1'
  source_ids: []
  verification: В плане и коде нет перечисленных самостоятельных функций или инфраструктуры без отдельного решения.
  api_gates: []
  acceptance_refs: []
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: SCP-04
  class: REQ
  statement: Сдать ссылку на GitHub-репозиторий, доступный проверяющим, и README с понятными инструкциями запуска
    и миграций. Обязательны FastAPI и SQLAlchemy; открытая публикация самого write-интерфейса приложения не требуется.
  source_sections:
  - '0.1'
  - '12.1'
  - '12.3'
  - '17'
  source_ids: []
  verification: Проверяющий имеет доступ к репозиторию и воспроизводит установку, миграции и запуск по README.
  api_gates: []
  acceptance_refs:
  - AC-Q-01
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: SCP-05
  class: OPEN_GATE
  statement: Сохранить рабочий пятидневный план; точное начало срока и требуемые права проверяющих на GitHub остаются
    организационным OPEN-07. Не считать его неизвестностью API и не блокировать им архитектуру.
  source_sections:
  - '15'
  - '16.1'
  source_ids:
  - OPEN-07
  verification: Начало срока и доступ к репозиторию явно зафиксированы к планированию сдачи; OPEN-07 не выдан за
    закрытый API-факт.
  api_gates: []
  acceptance_refs: []
  requirement_status: investigation_or_organizational_dependency
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-01
  class: REQ
  statement: Форма создания принимает обязательные непустое Name, Geo-код страны и Offer ID существующего оффера
    Keitaro.
  source_sections:
  - '3.1'
  source_ids:
  - C-01
  - C-02
  - C-03
  verification: У формы присутствуют три входа; пустое имя и отсутствующие обязательные значения не приводят к созданию.
  api_gates: []
  acceptance_refs:
  - AC-C-01
  - AC-C-03
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-02
  class: DESIGN
  statement: Принимать одиночный ISO country code или несколько через запятую, нормализовать пробелы и регистр,
    убрать повторы. Строгую семантику списка GEO подтвердить на Keitaro; одиночный код остаётся обязательной базой.
  source_sections:
  - '3.1'
  - '16.2'
  source_ids:
  - C-04
  verification: Одиночный код и список проходят нормализацию; API-фильтр использует проверенную семантику.
  api_gates:
  - OPEN-01
  acceptance_refs:
  - AC-C-07
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-03
  class: DESIGN
  statement: Выбор оффера при создании поддерживает поиск существующих офферов по ID/названию с автодополнением
    и возвращает действительный Offer ID.
  source_sections:
  - '3.1'
  - '9.1'
  source_ids:
  - C-05
  verification: Поиск выбирает существующий оффер и передаёт его ID, а не произвольное отображаемое имя.
  api_gates: []
  acceptance_refs: []
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-04
  class: REQ
  statement: Домен, группа и источник назначаются через Keitaro API именно созданной кампании.
  source_sections:
  - '3.1'
  - '3.2'
  source_ids:
  - C-06
  - C-12
  verification: Readback целевой кампании подтверждает все три обязательных назначения.
  api_gates:
  - OPEN-01
  - OPEN-05
  acceptance_refs:
  - AC-C-01
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-05
  class: DESIGN
  statement: Домен, группа и источник берутся из валидируемых конфигурируемых defaults; полноценные селекты необязательны.
    В env используются найденные на инстансе ID/имена. Если defaults отсутствуют или недоступны, создание не выполняется
    и выдаётся понятная ошибка. Не создавать новые группы/источники на лету и не считать домен образца, FORTESTS,
    CPC, стоимость или UTM обязательными константами.
  source_sections:
  - '3.1'
  source_ids:
  - C-07
  verification: Настройки приходят из конфигурации; неверные defaults останавливают Create до мутации; нет жёстко
    вшитых значений образца.
  api_gates:
  - OPEN-05
  acceptance_refs:
  - AC-C-01
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-06
  class: REQ
  statement: 'Созданная кампания содержит ровно два потока: первый по приоритету принимает указанные GEO и направляет
    на https://google.com; второй направляет не перехваченный первым трафик на выбранный Offer ID.'
  source_sections:
  - '3.2'
  source_ids:
  - C-09
  - C-10
  - C-11
  verification: Создание и readback подтверждают два потока, GEO-redirect и fallback для остальных посетителей.
  api_gates:
  - OPEN-01
  acceptance_refs:
  - AC-C-02
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-07
  class: DEMO-REQ
  statement: 'Для создаваемой схемы настроить позиционный порядок обработки потоков: GEO-поток выше офферного.'
  source_sections:
  - '3.2'
  - '3.3'
  source_ids:
  - C-13
  verification: Подтверждены позиционная обработка и приоритет GEO перед fallback.
  api_gates:
  - OPEN-01
  acceptance_refs:
  - AC-C-02
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-08
  class: DESIGN
  statement: После создания выбранный оффер присутствует в fallback-потоке в единственном экземпляре.
  source_sections:
  - '3.2'
  source_ids:
  - C-14
  verification: У fallback-потока одна привязка именно выбранного Offer ID.
  api_gates:
  - OPEN-01
  acceptance_refs:
  - AC-C-02
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: CRE-09
  class: ENG
  statement: До любых мутаций сервер проверяет имя, GEO, существование оффера и доступность defaults; ошибки входа
    объясняются пользователю. Затем создаёт кампанию с атрибутами, GEO-поток и fallback, устанавливает/проверяет
    порядок, перечитывает кампанию и потоки. SUCCESS с ID и ссылкой допустим только после совпадения ожидаемых ID,
    настроек и порядка с фактическими.
  source_sections:
  - '3.1'
  - '3.2'
  - '3.3'
  - '10.1'
  source_ids:
  - C-08
  - C-15
  verification: Неверные входы дают 422 до мутаций; успешный Create подтверждён readback, а не одним HTTP 2xx.
  api_gates:
  - OPEN-01
  - OPEN-05
  acceptance_refs:
  - AC-C-01
  - AC-C-03
  - AC-C-06
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-01
  class: DESIGN
  statement: 'Keitaro является источником истины о текущем удалённом составе потоков и сохранённых долях. Локальная
    SQLAlchemy-БД хранит собственные предметные сведения Adrobot: ранее известные привязки, имена для архива и Pin.
    Не создавать полную локальную копию всех кампаний/потоков/офферов; обязательный persistent operation journal
    и универсальная идемпотентность в модель не входят.'
  source_sections:
  - '2'
  - '7.1'
  source_ids: []
  verification: Текущий состав читается из Keitaro, а локальная БД обеспечивает требуемую историю и Pin без второго
    каталога текущих данных.
  api_gates: []
  acceptance_refs:
  - AC-E-07
  - AC-E-08
  - AC-E-09
  - AC-Q-02
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-02
  class: DESIGN
  statement: 'Реализовать known_offer_bindings: обязательные campaign_id, stream_id, offer_id с составной уникальностью;
    последнее подтверждённое offer_name; nullable integer pinned_share 1..100; last_seen_share как диагностическую
    историческую величину; first_seen_at и last_seen_at в UTC; nullable removed_at в UTC. Если API допускает повторные
    bindings одного Offer ID, проверить их идентичность и изменить ключ до реализации бизнес-логики, не теряя строки
    молча.'
  source_sections:
  - '7.2'
  - '16.1'
  source_ids:
  - OPEN-03
  verification: ORM и миграция согласованы по полям/ограничениям; last_seen_share не выдаётся за актуальную удалённую
    долю; ключ основан на проверенной идентичности binding.
  api_gates:
  - OPEN-03
  acceptance_refs:
  - AC-Q-02
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-03
  class: DESIGN
  statement: Синхронизировать архив только после полного валидного чтения потоков/привязок кампании со всеми страницами
    выдачи. В короткой транзакции upsert присутствующих привязок обновляет имя, last_seen_share и last_seen_at,
    сбрасывает removed_at и сохраняет Pin. Известным привязкам именно соответствующего потока, отсутствующим в полном
    ответе, выставить removed_at, сохранив имя/Pin. Вернуть актуальные и архивные строки; архивные имеют Removed,
    0 и Bring Back. Ошибка чтения/схемы не изменяет архив. Не восстанавливать неизвестную до первого Fetch историю;
    известный архив переживает перезапуск через БД.
  source_sections:
  - '7.3'
  - '10.1'
  source_ids: []
  verification: Полный Fetch обновляет только соответствующие привязки; неполный ответ не создаёт массовые Removed;
    после рестарта известный архив доступен.
  api_gates:
  - OPEN-03
  - OPEN-04
  acceptance_refs:
  - AC-E-09
  - AC-E-15
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-04
  class: DESIGN
  statement: До Push добавления/удаления/Pin остаются в браузерном draft и не загрязняют архив; потеря неопубликованного
    draft при закрытии/перезагрузке допустима с предупреждением. После подтверждённого Push короткая DB-транзакция
    сохраняет прочитанные bindings, архивирует удалённые и обновляет Pin. Если remote write подтверждён, но локальная
    фиксация не удалась, сообщить об изменённом Keitaro и неподтверждённой локальной синхронизации, предложить Fetch
    и не выполнять второй слепой PUT.
  source_sections:
  - '2'
  - '7.4'
  - '10.1'
  source_ids: []
  verification: Cancel не оставляет staged-only записей; ошибка DB после remote write видна отдельно и не порождает
    повтор мутации.
  api_gates: []
  acceptance_refs:
  - AC-E-03
  - AC-E-18
  - AC-E-20
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-05
  class: DESIGN
  statement: Fetch возвращает base_pinned_shares для всего известного набора, включая архив, и base_pin_revision
    как детерминированный отпечаток канонического перечня известных offer_id и их pinned_share. Не включать last_seen
    timestamps и не добавлять отдельное поле БД/журнал ради отпечатка. Preview использует переданную базу только
    для расчёта; Push перечитывает локальные Pin и сверяет её. Обнаруженное изменение даёт 409 CONFLICT без незаметного
    слияния или сброса чужих настроек; гарантия best-effort.
  source_sections:
  - '7.4'
  - '10.2'
  source_ids: []
  verification: Архивные Pin входят в базу; изменение локальной базы обнаруживается перед Push; обновление last_seen
    само по себе не меняет отпечаток.
  api_gates: []
  acceptance_refs:
  - AC-E-17
  - AC-E-19
  related_rules:
  - INT-08
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-06
  class: ENG
  statement: 'SQLAlchemy Session принадлежит запросу/use-case и не разделяется конкурентно; общей глобальной Session
    нет. Транзакции короткие и не удерживаются во время HTTP I/O. Для SQLite выбрать и документировать один последовательный
    подход: async SQLAlchemy с aiosqlite либо sync с короткими вызовами без блокирования event loop; не смешивать
    подходы хаотично.'
  source_sections:
  - '7.4'
  - '11.3'
  source_ids: []
  verification: Сессии изолированы; сетевые обращения вне DB-транзакций; выбранный sync/async-подход явно описан
    и не блокирует event loop.
  api_gates: []
  acceptance_refs: []
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: DATA-07
  class: ENG
  statement: Использовать SQLAlchemy 2.x и Alembic. alembic upgrade head создаёт согласованную схему на пустой БД
    и повторно работает без потери данных. Для локального приложения достаточно SQLite; ограничения конкурентных
    записей документируются. PostgreSQL и кластеризация не требуются.
  source_sections:
  - '7.4'
  - '13'
  - '17'
  source_ids: []
