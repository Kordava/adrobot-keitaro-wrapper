- id: INT-03
  class: ENG
  statement: 'Типизированно проверять важнейшие upstream-поля: отсутствующее обязательное поле или несовместимый
    JSON является интеграционной ошибкой, а не пустым результатом. Различать 401/403, 404, 422, 429, 5xx, timeout
    и сетевые ошибки. Ошибки входа дают 422 до мутаций; отсутствующие кампания/поток/оффер — 404 либо 422 по смыслу.
    Ошибки чтения не обновляют запрошенные данные; невозможный Pin не допускает remote write. Выбранный запрет удаления
    последнего активного оффера сохраняется до подтверждения поведения пустого fallback.'
