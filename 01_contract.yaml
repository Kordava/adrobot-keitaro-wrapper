- id: ED-09
  class: DEMO-REQ
  statement: Fetch/readback показывает фактически считанные доли без перераспределения и нормализации. Полученные
    25/25 остаются 25/25, а не 50/50. Это отображение конфигурации, не утверждение о вероятностях трафика; raw share
    нельзя считать процентом без подтверждённого API mapping.
