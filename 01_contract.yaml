- id: INT-08
  class: DESIGN
  statement: Перед Push перечитать удалённую конфигурацию и локальные Pin и сверить base_revision и base_pin_revision.
    Remote hash охватывает канонизированные поля целевого потока, которые update может перезаписать. Расхождение
    возвращает 409 CONFLICT до remote write; черновик не удаляется без подтверждения пользователя и предлагается
    Fetch. Это обязательная best-effort проверка; гонки между чтением/проверкой и remote/local фиксацией честно
    описываются, CAS не заявляется.
