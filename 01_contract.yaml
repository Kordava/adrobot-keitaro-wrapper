- id: ED-17
  class: DESIGN
  statement: Поля base_pinned_shares и pinned_shares представляют полное состояние закреплений, не patch. Карта
    содержит записи только с действующим Pin; отсутствующий ключ означает Unpin. Пустая карта снимает Pin у всех
    известных привязок потока и новых staged-only строк, включая архив. Неизменённый архивный Pin обязан присутствовать
    в полном наборе. Отсутствие всего поля pinned_shares — ошибка валидации; null не означает «оставить без изменения».
  source_sections:
  - '6.4'
  - '8.1'
  - '8.2'
  source_ids: []
  verification: Полный набор сохраняет архивный Pin; удаление ключа снимает его; отсутствие поля отклоняется.
  api_gates: []
  acceptance_refs:
