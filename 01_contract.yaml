  - AC-E-19
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-13
  class: DESIGN
  statement: В RECALCULATED fixed равен сумме Pin активных привязок, free = 100 - fixed, n — числу активных незакреплённых.
    При n > 0 и free > 0 каждому назначается free // n, а free % n единиц распределяются по одной в стабильном порядке
    активных офферов. Архивные строки показывают 0%, не входят в fixed и не резервируют доли. Результат domain выражается
    целыми percentage points; преобразование в поля Keitaro выполняется только по подтверждённому mapping.
  source_sections:
  - '6.2'
  source_ids: []
  verification: Проверить 34/33/33, 25/25/25/25, 20/20/20/20/20 и 25/38/37; одинаковые упорядоченные входы дают
    одинаковые числа.
  api_gates:
  - OPEN-02
  acceptance_refs:
  - AC-E-02
  - AC-E-03
  - AC-E-11
  - AC-E-12
  - AC-E-13
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-14
  class: DESIGN
  statement: При n == 0 композиционное изменение допустимо только при fixed == 100. Fixed > 100, free < 0, n > 0
    при free == 0, недопустимые нулевые или отрицательные доли запрещают публикацию с понятной ошибкой. Ноль активных
    офферов в редактируемом fallback-потоке запрещён принятой моделью до подтверждения поведения пустого потока.
    Значение сохранённого Pin — integer от 1 до 100 либо отсутствие закрепления.
  source_sections:
  - '6.2'
  - '7.2'
  source_ids: []
  verification: Невозможная композиция и удаление последнего активного fallback-оффера не вызывают remote write.
  api_gates:
  - OPEN-04
  acceptance_refs:
  - AC-E-14
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-15
  class: DESIGN
  statement: 'Полное совпадение итогового упорядоченного активного состава и всего набора Pin, включая архивные
    строки, с базой имеет приоритет в любом режиме: восстановить исходные считанные доли, SNAPSHOT/CLEAN, без ненужного
