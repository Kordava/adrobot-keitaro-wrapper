  - '6.1'
  - '6.4'
  source_ids:
  - E-07
  verification: Оба порядка Unpin(A) → Bring Back(C) и Bring Back(C) → Unpin(A) при базе A25/B25 с Pin(A25) дают
    34/33/33.
