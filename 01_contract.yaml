  - AC-E-13
  - AC-E-20
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-20
  class: DESIGN
  statement: 'Preview stateless: не читает Keitaro на каждом нажатии и ничего не записывает в Keitaro или БД. Клиентская
    база допустима только для нефиксирующего расчёта; проверяются диапазоны, уникальность и согласованность. Возвращаются
    нормализованные состав, Pin, mode, доли, статусы, dirty и validation_error; при недопустимом изменении UI сохраняет
    последний валидный черновик.'
  source_sections:
  - '5'
  - '6.3'
  - '8.1'
  source_ids: []
  verification: Preview работает без upstream вызовов и DB writes; невалидная попытка не заменяет последний валидный
    результат.
  api_gates: []
  acceptance_refs:
  - AC-E-02
  - AC-E-14
  - AC-E-20
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-21
  class: DESIGN
  statement: 'UI сериализует Preview: до завершения запроса действия и Push для этого черновика заблокированы. UI
    хранит точные канонические входы последнего успешного Preview и его ответ. Изменение состава, Pin или режима
    инвалидирует Preview; Push допускается только для актуального успешного результата. Ошибочный, отставший или
    незавершённый Preview не разрешает публикацию.'
  source_sections:
  - '5'
  - '8.2'
  source_ids: []
  verification: Нельзя опубликовать черновик во время Preview либо после устаревшего или ошибочного ответа.
  api_gates: []
  acceptance_refs:
  - AC-E-04
  - AC-E-20
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-22
  class: DESIGN
  statement: 'Push использует реальные повторно прочитанные базы и те же канонические active_offer_ids, полный pinned_shares
    и mode, что актуальный Preview, повторно применяя ту же domain-функцию. Серверную историю Preview хранить не
    требуется: совпадение с показанным результатом при неизменных базах обеспечивается одинаковыми входами и актуальностью
    UI. Прямой API-вызов независимо валидируется, но не получает обещания сверки с историей Preview.'
  source_sections:
  - '6.3'
  - '8.2'
  source_ids: []
  verification: Push при неизменных подтверждённых базах рассчитывает в точности показанный актуальным Preview состав
    и доли.
  api_gates: []
  acceptance_refs:
  - AC-E-04
  - AC-E-13
  - AC-E-20
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-23
  class: ENG
  statement: Если remote состав или доли должны измениться, Push применяет подготовленную конфигурацию, повторно
    читает Keitaro и проверяет совпадение. Несовпадающий readback не считается SUCCESS. Новая база и CLEAN/SNAPSHOT
    устанавливаются только после необходимого подтверждения remote результата и локальных настроек; клиентские готовые
    проценты не являются источником истины.
  source_sections:
  - '4.2'
  - '5'
  - '6.3'
  - '6.4'
  - '7.4'
  - '8.2'
  - '8.3'
  source_ids:
  - E-06
  verification: Push подтверждает ID и значения readback; несовпадение оставляет исход неподтверждённым и не очищает
    черновик как успешный.
  api_gates:
  - OPEN-02
  - OPEN-03
  - OPEN-06
  acceptance_refs:
  - AC-E-04
  - AC-E-08
  - AC-E-12
  - AC-E-18
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-24
  class: DESIGN
  statement: Если изменились только Pin, а remote состав и доли совпадают с базой, Push сохраняет только локальные
    настройки без upstream PUT и подтверждает их чтением. В SNAPSHOT исходные 25/25 не нормализуются. В RECALCULATED
    изменение Pin/Unpin может изменить доли и тогда требует соответствующего remote PUT.
  source_sections:
  - '5'
  - '6.3'
  - '6.4'
  - '8.2'
  - '8.3'
  source_ids: []
  verification: Pin-only Preview/Push для SNAPSHOT A25/B25 сохраняет 25/25 и делает только локальную запись.
  api_gates: []
  acceptance_refs:
  - AC-E-19
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-25
  class: DESIGN
  statement: View in KT открывает конкретную кампанию в админке. Неопубликованный черновик заметен через DIRTY или
    выделение потока и действия публикации/отмены. Изменение только локальных Pin также остаётся DIRTY до подтверждённого
    локального Push, если Pin отличается от базы.
  source_sections:
  - '4.1'
  - '5'
  source_ids:
  - E-08
  - E-09
  verification: Ссылка ведёт на выбранную кампанию; неопубликованное pin-only изменение видно как DIRTY.
  api_gates: []
  acceptance_refs:
  - AC-E-20
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-26
  class: ENG
  statement: Ошибки чтения и записи явно показываются, не подменяются пустой таблицей и HTTP 200. Ошибка содержит
    машинно-читаемый code, безопасное message и request_id, без credentials и traceback. FAILED, UNKNOWN и CONFLICT
    описывают исход команды, не долговечный workflow; черновик сохраняется. Во время SAVING повторный Push заблокирован,
    автоматического повтора неизвестной записи нет; UI-блокировка не объявляется глобальной идемпотентностью.
  source_sections:
  - '4.1'
  - '5'
  - '8.3'
  source_ids:
  - E-10
  verification: Ошибка upstream видна и сохраняет draft; повторный Push во время SAVING и слепой повтор UNKNOWN
    отсутствуют.
  api_gates: []
  acceptance_refs:
  - AC-E-18
  - AC-E-20
  - AC-Q-06
  - AC-Q-07
  - AC-Q-08
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
internal_http_routes:
  upstream_keitaro_routes: false
  source_section: '8'
  note: Маршруты Adrobot из ТЗ. Поля иллюстративных JSON могут адаптироваться; их пользовательская семантика нормативна.
    Это не установленные endpoints Keitaro.
  routes:
  - method: GET
    path: /
    purpose: Создатель кампаний / ссылки на редактор
    source_section: '8'
  - method: GET
    path: /editor
    purpose: Страница редактора
    source_section: '8'
  - method: GET
    path: /api/offers?query=...
    purpose: Поиск существующих офферов в Keitaro, только чтение
    source_section: '8'
  - method: GET
    path: /api/reference-data
    purpose: Проверка/получение настроек домена, группы, источника, только чтение
    source_section: '8'
  - method: POST
    path: /api/campaigns
    purpose: Создать кампанию с двумя потоками
    source_section: '8'
  - method: GET
    path: /api/campaigns/{campaign_id}/editor
    purpose: Fetch потоков; **локальная синхронизация архива**, без remote write
    source_section: '8'
  - method: POST
    path: /api/campaigns/{campaign_id}/streams/{stream_id}/preview
    purpose: Чистый пересчёт черновика без изменений БД/Keitaro
    source_section: '8'
  - method: PUT
    path: /api/campaigns/{campaign_id}/streams/{stream_id}/offers
    purpose: Push желаемого состава и Pin, сравнение состояния, remote write/readback/локальный sync
    source_section: '8'
  - method: GET
    path: /health
    purpose: Проверка работоспособности процесса, без мутации
    source_section: '8'
