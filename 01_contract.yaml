  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-18
  class: DESIGN
  statement: Pin хранится по привязке campaign/stream/offer и сохраняется у архивной строки, не резервируя долю
    до Bring Back. При невозможном восстановлении Preview сообщает ограничение и позволяет снять конфликтующий Pin.
    Если внешний пользователь изменил долю закреплённого оффера в Keitaro, Fetch показывает фактическую долю и отдельное
    локальное намерение Pin с предупреждением; принудительного upstream изменения нет.
  source_sections:
  - '4.4'
  - '6.4'
  - '7.2'
  source_ids: []
  verification: Архивный Pin учитывается только после восстановления; внешнее изменение доли не перезаписывается
    Fetch.
  api_gates:
  - OPEN-02
  - OPEN-03
  acceptance_refs:
  - AC-E-19
  requirement_status: required_by_active_spec
  source_file: source/Adrobot_TZ_v0.3.1.md
- id: ED-19
  class: ENG
  statement: 'Preview и Push используют одну чистую, детерминированную, типизированную Python domain-функцию без
    I/O. Логические входы: base_offers с порядком и считанными значениями, base_pinned_shares, упорядоченные active_offer_ids,
    полный pinned_shares и mode. Выход содержит валидированное состояние, доли, dirty и ошибки ограничений. JavaScript
    не реализует отдельный алгоритм процентов.'
  source_sections:
  - '6.3'
  - '8.1'
  - '8.2'
  source_ids: []
  verification: Одинаковые базовые данные, порядок IDs, полный Pin и режим дают одинаковые результаты Preview и
    расчёта Push.
  api_gates: []
  acceptance_refs:
