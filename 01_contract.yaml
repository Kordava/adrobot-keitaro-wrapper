- id: ED-10
  class: DESIGN
  statement: Принятое Add, Remove или Bring Back, реально меняющее активный состав, устанавливает RECALCULATED и
    применяет алгоритм пересчёта. Отклонённое действие не меняет предыдущий валидный черновик, режим или доли. SNAPSHOT
    допустим только при неизменном относительно базы активном составе, кроме приоритетного правила полного возврата,
    которое само восстанавливает SNAPSHOT.
  source_sections:
