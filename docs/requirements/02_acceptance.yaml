interpretation:
- Один AC может требовать нескольких проверок и участия нескольких задач. Частичная проверка domain не закрывает
  AC, если строка также требует Push/readback.
- Правила без отдельного AC сохраняют обязательность по ТЗ/DoD. Отсутствие AC-ссылки не разрешает их пропускать.
- Перечень — ожидаемое поведение, а не утверждение о прохождении тестов. Реализация и live-интеграция в этом пакете
  не проверены.
