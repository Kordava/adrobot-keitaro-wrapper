- id: ED-08
  class: DESIGN
  statement: Успешный Fetch и подтверждённый Push фиксируют базовый упорядоченный список активных привязок, фактически
    прочитанные доли, известный архив, полный базовый набор Pin, base_revision и base_pin_revision. Начальное состояние
    черновика — SNAPSHOT/CLEAN. HTML-страница /editor и JSON-Fetch /api/campaigns/{campaign_id}/editor имеют разные
    назначения; это маршруты Adrobot, не Keitaro Admin API.
