- id: ED-11
  class: DEMO-REQ
  statement: Pin закрепляет текущую отображаемую целочисленную долю конкретной привязки в момент принятого действия.
    При перераспределении активного состава закреплённые доли сохраняются, а остаток делят незакреплённые. Свободное
    изменение процента руками не требуется.
