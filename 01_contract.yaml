- id: ED-16
  class: DESIGN
  statement: 'Cancel локально восстанавливает последнюю подтверждённую базу: активный состав, считанные доли, архив,
    все Pin, SNAPSHOT/CLEAN и валидный базовый Preview. Серверного Cancel API и write-запросов к Keitaro нет. Новые,
    добавленные и затем отменённые офферы не сохраняются в архив; Pin отменённого staged-only добавления также исчезает
    из черновика.'
